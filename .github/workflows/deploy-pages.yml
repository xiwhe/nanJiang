name: Sync weather and deploy Pages

on:
  push:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate trip configuration
        run: node scripts/validate-trip-config.mjs

      - name: Restore previous weather data
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: data/cma-weather.json
          key: cma-weather-${{ github.run_id }}
          restore-keys: |
            cma-weather-

      - name: Fetch CMA forecasts
        continue-on-error: true
        run: node scripts/fetch-cma-weather.mjs

      # 重跑同一 job 时 run_id 不变，cache/save 会因 key 已存在而失败，故一并容错。
      - name: Save weather data for next run
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: data/cma-weather.json
          key: cma-weather-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5